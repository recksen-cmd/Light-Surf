<!doctype html><meta charset="utf-8"><title>Dive playtest</title><button id="run">Run dive check</button><pre id="result">Ready</pre><iframe id="game" src="../index.html" width="960" height="720"></iframe><script>
run.onclick=async()=>{try{const w=game.contentWindow,d=w.document,wait=ms=>new Promise(r=>setTimeout(r,ms));await d.getElementById('start').onclick();d.getElementById('reset').click();const key=(code,type)=>w.dispatchEvent(new w.KeyboardEvent(type,{code,bubbles:true}));key('Space','keydown');key('ArrowUp','keydown');await wait(3200);const deep=w.lightSurf.snapshot();key('ArrowUp','keyup');await wait(500);const release=w.lightSurf.snapshot();await wait(5500);const surface=w.lightSurf.snapshot();key('Space','keyup');w.dispatchEvent(new w.KeyboardEvent('keydown',{code:'Escape'}));const music=d.getElementById('music').dataset;result.textContent=JSON.stringify({pass:deep.state.sink>3&&release.state.sink>2&&Math.abs(surface.state.sink)<1&&music.aligned==='true',deep:deep.state.sink,release:release.state.sink,surface:surface.state.sink,music:music.musicState,error:d.getElementById('error').textContent},null,2);}catch(e){result.textContent=e.stack;}};
</script>
